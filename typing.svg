<svg width="480" height="60" viewBox="0 0 480 60" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="reveal">
      <rect x="0" y="0" width="0" height="60">
        <animate attributeName="width"
                 values="0;460;460;0;0"
                 keyTimes="0;0.55;0.8;0.95;1"
                 dur="6s"
                 repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <g clip-path="url(#reveal)">
    <text x="8" y="40"
          font-family="'Comic Sans MS', 'Chalkboard SE', 'Segoe Print', cursive, sans-serif"
          font-size="28"
          font-weight="700"
          fill="#FF6FA5"
          textLength="440"
          lengthAdjust="spacingAndGlyphs">Merhaba, ben Aleyna 👋</text>
  </g>

  <!-- blinking cursor that tracks the reveal width -->
  <rect y="12" width="3" height="34" fill="#FF6FA5">
    <animate attributeName="x"
             values="8;448;448;8;8"
             keyTimes="0;0.55;0.8;0.95;1"
             dur="6s"
             repeatCount="indefinite"/>
    <animate attributeName="opacity"
             values="1;0;1;0;1;0;1"
             keyTimes="0;0.14;0.28;0.42;0.56;0.7;1"
             dur="6s"
             repeatCount="indefinite"/>
  </rect>
</svg>
