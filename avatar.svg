<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#FF6FA5" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#FF6FA5" stop-opacity="0"/>
    </radialGradient>
    <filter id="chipShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#1a1a2e" flood-opacity="0.18"/>
    </filter>
  </defs>

  <circle cx="250" cy="200" r="230" fill="url(#bgGlow)"/>

  <!-- orbit guide ring -->
  <circle cx="250" cy="175" r="150" fill="none" stroke="#F6A8C6" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.55"/>

  <!-- ===== avatar ===== -->
  <g id="avatar">
    <!-- shoulders / body -->
    <path d="M140,500 L140,410 C140,352 189,318 250,318 C311,318 360,352 360,410 L360,500 Z" fill="#FF6FA5"/>
    <path d="M140,500 L140,410 C140,352 189,318 250,318 C260,318 270,319 279,321 C225,330 186,362 186,410 L186,500 Z" fill="#E8558E"/>

    <!-- neck -->
    <rect x="228" y="248" width="44" height="46" rx="14" fill="#F0B594"/>

    <!-- hair back (straight, past shoulders) -->
    <path d="M182,150
             C182,103 212,66 250,66
             C288,66 318,103 318,150
             L318,300 L292,300 L292,164 L208,164 L208,300 L182,300 Z"
          fill="#E8B94D"/>

    <!-- head -->
    <circle cx="250" cy="188" r="66" fill="#F5C6A0"/>

    <!-- ears -->
    <circle cx="188" cy="192" r="10" fill="#F5C6A0"/>
    <circle cx="312" cy="192" r="10" fill="#F5C6A0"/>

    <!-- straight fringe / bangs -->
    <path d="M186,158
             C186,116 213,84 250,84
             C287,84 314,116 314,158
             L314,178
             C314,178 300,158 250,158
             C200,158 186,178 186,178
             Z"
          fill="#E8B94D"/>

    <!-- straight side strands framing face -->
    <path d="M182,150 C182,150 178,230 186,300 L206,300 C200,240 202,175 208,150 Z" fill="#E8B94D"/>
    <path d="M318,150 C318,150 322,230 314,300 L294,300 C300,240 298,175 292,150 Z" fill="#E8B94D"/>

    <!-- hair top sheen -->
    <path d="M212,110 C224,96 236,90 250,90" stroke="#C9962E" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>

    <!-- face: calm closed eyes -->
    <path d="M218,192 Q228,200 238,192" stroke="#6B4A2E" stroke-width="4" stroke-linecap="round" fill="none"/>
    <path d="M262,192 Q272,200 282,192" stroke="#6B4A2E" stroke-width="4" stroke-linecap="round" fill="none"/>

    <!-- earrings -->
    <circle cx="188" cy="206" r="3.5" fill="#FFD86B" stroke="#E0A93A" stroke-width="1"/>
    <circle cx="312" cy="206" r="3.5" fill="#FFD86B" stroke="#E0A93A" stroke-width="1"/>
    <circle cx="188" cy="214" r="2" fill="#FFE9A8"/>
    <circle cx="312" cy="214" r="2" fill="#FFE9A8"/>

    <!-- blush -->
    <circle cx="214" cy="212" r="9" fill="#F49A8A" opacity="0.45"/>
    <circle cx="286" cy="212" r="9" fill="#F49A8A" opacity="0.45"/>

    <!-- smile -->
    <path d="M232,220 Q250,234 268,220" stroke="#B5654A" stroke-width="4" stroke-linecap="round" fill="none"/>
  </g>

  <!-- ===== orbiting tech logos ===== -->
  <g id="orbit">
    <animateTransform attributeName="transform" type="rotate" from="0 250 175" to="360 250 175" dur="26s" repeatCount="indefinite"/>

    <g transform="translate(400,175)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-17" y="-17" width="34" height="34"/>
      </g>
    </g>

    <g transform="translate(325,305)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-16" y="-16" width="32" height="32"/>
      </g>
    </g>

    <g transform="translate(175,305)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-16" y="-16" width="32" height="32"/>
      </g>
    </g>

    <g transform="translate(100,175)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-16" y="-16" width="32" height="32"/>
      </g>
    </g>

    <g transform="translate(175,45)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-16" y="-16" width="32" height="32"/>
      </g>
    </g>

    <g transform="translate(325,45)">
      <g>
        <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="-360 0 0" dur="26s" repeatCount="indefinite"/>
        <circle r="27" fill="#ffffff" stroke="#E7E4F6" stroke-width="1.5" filter="url(#chipShadow)"/>
        <image href="data:image/svg+xml;base64," x="-16" y="-16" width="32" height="32"/>
      </g>
    </g>
  </g>
</svg>
